name: Release

# Runs only when a version tag (e.g. 0.1.0, no "v" prefix) is pushed.
# Creates a DRAFT release; publishing it stays a manual step.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci

      - name: Check that the tag matches manifest.json and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest_version" ]; then
            echo "Tag $tag does not match manifest.json version $manifest_version" >&2
            exit 1
          fi
          node -e "const v=require('./versions.json'); if(!(process.argv[1] in v)) { console.error('versions.json has no entry for ' + process.argv[1]); process.exit(1) }" "$tag"

      - run: npm test
      - run: npm run lint
      - run: npm run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            main.js manifest.json styles.css
